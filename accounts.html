<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Accounts – BankEase Net Banking</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-badge">B</div>
                <div class="logo-text">
                    <h2>BankEase</h2>
                    <span>Net Banking</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><span>📊</span> <span>Dashboard</span></a>
                <a href="accounts.html" class="nav-link active"><span>💳</span> <span>My Accounts</span></a>
                <a href="transfer.html" class="nav-link"><span>💸</span> <span>Fund Transfer</span></a>
                <a href="beneficiaries.html" class="nav-link"><span>👥</span> <span>Beneficiaries</span></a>
                <a href="transactions.html" class="nav-link"><span>📜</span> <span>Transactions</span></a>
                <a href="bill-payments.html" class="nav-link"><span>🧾</span> <span>Bill Payments</span></a>
                <a href="loans.html" class="nav-link"><span>🏦</span> <span>Loans</span></a>
                <a href="investments.html" class="nav-link"><span>📈</span> <span>Investments</span></a>
                <a href="support.html" class="nav-link"><span>💬</span> <span>Support</span></a>
                <a href="notifications.html" class="nav-link"><span>🔔</span> <span>Notifications</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-snippet">
                    <div class="avatar user-initials">U</div>
                    <div class="user-info">
                        <div class="name user-fullname">Loading...</div>
                        <div class="sub user-role-badge badge badge-primary">Customer</div>
                    </div>
                </div>
                <a href="#" class="logout-btn" title="Sign Out" style="color: #94a3b8; font-size: 18px;">⏻</a>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="top-navbar">
                <div class="top-title">
                    <h1>Account Management</h1>
                </div>
                <div class="top-actions">
                    <button id="open-modal-btn" class="btn btn-primary">+ Open New Account</button>
                </div>
            </header>

            <main class="content-body">
                <div id="accounts-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
                    <!-- Accounts injected dynamically -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for opening a new bank account -->
    <div id="new-account-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Open New Bank Account</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="new-account-form">
                <div class="form-group">
                    <label class="form-label" for="new-acc-type">Account Type</label>
                    <select id="new-acc-type" class="form-control" required>
                        <option value="SAVINGS">Savings Account (4.0% p.a.)</option>
                        <option value="CURRENT">Current Account (Business/Zero Limit)</option>
                        <option value="FIXED_DEPOSIT">Fixed Deposit Account (7.25% p.a.)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="new-acc-deposit">Initial Deposit Amount (₹)</label>
                    <input type="number" id="new-acc-deposit" class="form-control" value="5000.00" min="500" step="500" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Confirm & Open Account</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
