<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History – BankEase Net Banking</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-badge">B</div>
                <div class="logo-text">
                    <h2>BankEase</h2>
                    <span>Net Banking</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> <span>Dashboard</span></a>
                <a href="accounts.html" class="nav-link customer-only"><i data-lucide="credit-card"></i> <span>My Accounts</span></a>
                <a href="transfer.html" class="nav-link customer-only"><i data-lucide="send"></i> <span>Fund Transfer</span></a>
                <a href="beneficiaries.html" class="nav-link customer-only"><i data-lucide="users"></i> <span>Beneficiaries</span></a>
                <a href="transactions.html" class="nav-link active"><i data-lucide="receipt"></i> <span>Transactions</span></a>
                <a href="bill-payments.html" class="nav-link customer-only"><i data-lucide="file-text"></i> <span>Bill Payments</span></a>
                <a href="loans.html" class="nav-link"><i data-lucide="landmark"></i> <span>Loans</span></a>
                <a href="investments.html" class="nav-link customer-only"><i data-lucide="trending-up"></i> <span>Investments</span></a>
                <a href="support.html" class="nav-link"><i data-lucide="help-circle"></i> <span>Support</span></a>
                <a href="notifications.html" class="nav-link"><i data-lucide="bell"></i> <span>Notifications</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-snippet">
                    <div class="avatar user-initials">U</div>
                    <div class="user-info">
                        <div class="name user-fullname">Loading...</div>
                        <div class="sub user-role-badge badge badge-primary">Customer</div>
                    </div>
                </div>
                <a href="#" class="logout-btn" title="Sign Out" style="color: #94a3b8; font-size: 18px; display: inline-flex; align-items: center;"><i data-lucide="log-out"></i></a>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="top-navbar">
                <div class="top-title">
                    <h1>Transaction History & Statement</h1>
                </div>
                <div class="top-actions">
                    <button class="btn btn-secondary btn-sm" onclick="exportStatement()"><i data-lucide="download"></i> Export Statement</button>
                </div>
            </header>

            <main class="content-body">
                <!-- Filters -->
                <div class="card" style="padding: 16px 24px; margin-bottom: 20px;">
                    <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 200px;">
                            <label class="form-label">Transaction Type</label>
                            <select id="filter-type" class="form-control" onchange="loadTransactions()">
                                <option value="">All Types</option>
                                <option value="TRANSFER">Fund Transfers</option>
                                <option value="BILL_PAYMENT">Bill Payments</option>
                                <option value="LOAN_REPAYMENT">Loan Repayments</option>
                                <option value="INVESTMENT">Investments</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label class="form-label">Status</label>
                            <select id="filter-status" class="form-control" onchange="loadTransactions()">
                                <option value="">All Statuses</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="PENDING">Pending</option>
                                <option value="FAILED">Failed</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Reference #</th>
                                    <th>Initiated By</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date & Time</th>
                                    <th>Ledger Impact</th>
                                </tr>
                            </thead>
                            <tbody id="transactions-body">
                                <tr><td colspan="7" style="text-align:center;">Loading statement...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/transactions.js"></script>
    <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
