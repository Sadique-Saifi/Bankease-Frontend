<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications – BankEase Net Banking</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-badge">B</div>
                <div class="logo-text">
                    <h2>BankEase</h2>
                    <span>Net Banking</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><span>📊</span> <span>Dashboard</span></a>
                <a href="accounts.html" class="nav-link customer-only"><span>💳</span> <span>My Accounts</span></a>
                <a href="transfer.html" class="nav-link customer-only"><span>💸</span> <span>Fund Transfer</span></a>
                <a href="beneficiaries.html" class="nav-link customer-only"><span>👥</span> <span>Beneficiaries</span></a>
                <a href="transactions.html" class="nav-link"><span>📜</span> <span>Transactions</span></a>
                <a href="bill-payments.html" class="nav-link customer-only"><span>🧾</span> <span>Bill Payments</span></a>
                <a href="loans.html" class="nav-link"><span>🏦</span> <span>Loans</span></a>
                <a href="investments.html" class="nav-link customer-only"><span>📈</span> <span>Investments</span></a>
                <a href="support.html" class="nav-link"><span>💬</span> <span>Support</span></a>
                <a href="notifications.html" class="nav-link active"><span>🔔</span> <span>Notifications</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-snippet">
                    <div class="avatar user-initials">U</div>
                    <div class="user-info">
                        <div class="name user-fullname">Loading...</div>
                        <div class="sub user-role-badge badge badge-primary">Customer</div>
                    </div>
                </div>
                <a href="#" class="logout-btn" title="Sign Out" style="color: #94a3b8; font-size: 18px;">⏻</a>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="top-navbar">
                <div class="top-title">
                    <h1>Notifications</h1>
                </div>
                <div class="top-actions">
                    <span id="unread-count-badge" class="badge badge-primary" style="font-size: 13px;">0 unread</span>
                    <button class="btn btn-secondary btn-sm" onclick="markAllRead()">Mark All Read</button>
                </div>
            </header>

            <main class="content-body">
                <div id="notifications-list">
                    <p style="color: var(--text-muted);">Loading notifications...</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
